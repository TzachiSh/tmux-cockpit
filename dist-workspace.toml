[workspace]
members = ["cargo:tui"]

# Config for 'dist'
#
# Written by `dist init` (0.32.0) and edited in four places, each of which
# scripts/tui-fetch depends on: unified-checksum publishes the one sha256.sum
# the fetch reads before it touches a tarball, unix-archive makes the assets
# .tar.gz rather than dist's default .tar.xz, installers stay empty because the
# plugin's bin/ is the install path, and tag-namespace makes `cockpit-tui-v0.1.0`
# the release tag so the plugin can be tagged separately from its binary.
#
# The namespace has to be the PACKAGE name, not a nickname: it only sets the CI
# tag filter, while the tag itself is parsed by axotag, which accepts v<ver>,
# <package>-v<ver> or <package>/v<ver>. `tui-v0.1.0` is none of those and the
# plan step died on it (#79).
#
# No aarch64-unknown-linux-musl: it needs hand-wired cross linkers
# (cargo-dist #1581). That platform falls through to the source build.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
# The installers to generate for each app
installers = []
# Checksums to generate for each App
checksum = "sha256"
unified-checksum = true
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# A prefix git tags must include for dist to care about them
tag-namespace = "cockpit-tui"

# dist 0.32.0 picks macos-14 for this target; GitHub retires that image on
# 2026-11-02 and its brownouts cancel the job (runner-images#13518).
#
# Everything Linux runs on ci-cockpit, the self-hosted runner TzachiSh/ci-box#367
# set up, by its label. plan, the global build, host and announce run on the
# runner itself, whose image carries cargo for them. The musl build runs in a
# rust container, where dist calls apt-get without sudo. The mac builds stay on
# GitHub's runners: no self-hosted one runs macOS.
[dist.github-custom-runners]
global = "cockpit"
aarch64-apple-darwin = "macos-15"

[dist.github-custom-runners.x86_64-unknown-linux-musl]
runner = "cockpit"
container = { image = "rust:1-bookworm", host = "x86_64-unknown-linux-gnu", package-manager = "apt" }
