set -g mouse on
set -g @cockpit_agents_glob "|claude|codex|aider|cursor|opencode|gemini|crush|"
set -g @thm_red '#ff6b6b'
set -g @thm_peach '#ff9838'
set -g @thm_yellow '#ffcc33'
set -g @thm_green '#3dea7d'
set -g @thm_overlay_0 '#5b6272'
set -g @cockpit_blocked_bg '#52303a'
set -g pane-border-status top
set -g pane-border-style "fg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-active-border-style "fg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-border-format "#{?pane_active,,#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#[fg=#{@thm_red}]#[bold]─ NEEDS YOU #{=/48/…:#{@panestate_msg}}#[default],#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#[fg=#{@thm_peach}]#[bold]─ ERROR #[default],}}}#{?#{mouse},#[align=right]#{?#{e|>:#{window_panes},1},#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange],}#[range=control|9][x]#[norange],}"
set -g window-status-format " #{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{==:#{pane_title},#{host_short}},#W,#{=/16/…:#{s/^✳ //:#{pane_title}}}},#W} #{?#{m:*needs-input*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_green}]✓,#{?#{m:*A*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},A,}}},#[fg=#{@thm_overlay_0}]○,}}}}}#{?#{e|>=:#{@panestate_ctx},80},#[fg=colour208] ◔#{@panestate_ctx}%,}"
set -g window-status-current-format " #{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{==:#{pane_title},#{host_short}},#W,#{=/16/…:#{s/^✳ //:#{pane_title}}}},#W} #{?#{m:*needs-input*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_green}]✓,#{?#{m:*A*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},A,}}},#[fg=#{@thm_overlay_0}]○,}}}}}#{?#{e|>=:#{@panestate_ctx},80},#[fg=colour208] ◔#{@panestate_ctx}%,}"
set -g window-style "bg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@cockpit_blocked_bg},default}"
set -g window-active-style "bg=default"
