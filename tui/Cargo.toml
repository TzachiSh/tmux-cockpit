[package]
name = "cockpit-tui"
version = "0.1.0"
edition = "2024"
# ratatui 0.30.2's MSRV, written once: the .tmux source-build fallback and CI
# both read the floor from here (Debian 13 ships 1.85, Ubuntu 24.04 ships 1.75).
rust-version = "1.88"

[dependencies]
ansi-to-tui = "8.0.1"
# Pinned exactly, never a caret: crossterm #1104 (open, 2026-08) wedges the
# parser on an unrecognised `CSI ? … $y` report and swallows all later input.
crossterm = "=0.29.0"
libc = "0.2"
ratatui = "0.30.2"
# preserve_order: the 14 `--json` keys are a frozen contract and serde_json's
# default map is a BTreeMap, which would emit them alphabetically.
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
# Paired with ratatui::init(), whose panic hook restores the terminal before the
# abort. Never pair abort with a Drop-based terminal guard: Drop never runs.
panic = "abort"
