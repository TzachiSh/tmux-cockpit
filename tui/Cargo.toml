[package]
name = "cockpit-tui"
version = "0.4.0"
edition = "2024"
# ratatui 0.30.2's MSRV, written once: the .tmux source-build fallback and CI
# both read the floor from here (Debian 13 ships 1.85, Ubuntu 24.04 ships 1.75).
rust-version = "1.88"
# Not decoration: without it `dist plan` and `dist generate --check` both refuse
# ("Github CI support requires you to specify the URL of your repository").
repository = "https://github.com/TzachiSh/tmux-cockpit"

[dependencies]
ansi-to-tui = "8.0.1"
# Pinned exactly, never a caret: crossterm #1104 (open, 2026-08) wedges the
# parser on an unrecognised `CSI ? … $y` report and swallows all later input.
crossterm = "=0.29.0"
# The file browser lists a folder the way ripgrep does: .gitignore, .ignore and git's
# global excludes. Exact pin, a release older than two weeks.
ignore = "=0.4.33"
libc = "0.2"
ratatui = "0.30.2"
# Width budgets subtract ellipsis.width() and never count chars: U+2328 plus
# U+FE0F sums to 1 char-wise but measures 2, a one-column overrun per title.
unicode-width = "0.2"
# The panel's text boxes move by grapheme cluster: a ZWJ family or a flag is
# one symbol on screen. Already in the tree through ratatui.
unicode-segmentation = "1.13"
# preserve_order: the 14 `--json` keys are a frozen contract and serde_json's
# default map is a BTreeMap, which would emit them alphabetically.
serde_json = { version = "1.0.151", features = ["preserve_order"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
# Paired with ratatui::init(), whose panic hook restores the terminal before the
# abort. Never pair abort with a Drop-based terminal guard: Drop never runs.
panic = "abort"

# What cargo-dist builds with. `inherits` alone, deliberately: `dist init` also
# writes `lto = "thin"`, which would quietly ship every release binary at thin
# LTO instead of the fat LTO above.
[profile.dist]
inherits = "release"
