# The raw environment writers (#1132). tui/Cargo.toml forbids the lint, so a test writes
# only through fake::set_var and fake::remove_var, which take the lock's token.
# tests/tui-clippy-canary.sh calls each path in
# tui/examples/clippy_canary.rs and fails unless clippy refuses every call.

[[disallowed-methods]]
path = "std::env::set_var"
reason = "take fake::env_lock() and call fake::set_var(&held, ..) (#1132)"

[[disallowed-methods]]
path = "std::env::remove_var"
reason = "take fake::env_lock() and call fake::remove_var(&held, ..) (#1132)"

[[disallowed-methods]]
path = "libc::setenv"
reason = "take fake::env_lock() and call fake::set_var(&held, ..) (#1132)"

[[disallowed-methods]]
path = "libc::unsetenv"
reason = "take fake::env_lock() and call fake::remove_var(&held, ..) (#1132)"

[[disallowed-methods]]
path = "libc::putenv"
reason = "take fake::env_lock() and call fake::set_var(&held, ..) (#1132)"

[[disallowed-methods]]
path = "libc::clearenv"
reason = "take fake::env_lock() and call fake::remove_var(&held, ..) for each (#1132)"
