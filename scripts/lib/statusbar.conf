# tmux-cockpit's palette, status line and pane borders. cockpit.tmux sources this
# file, then sets the parts that need its own path (@cockpit_where_path, the hooks).
# Formats only: no shell runs on a redraw. Agent state is precomputed by
# scripts/agent-state (@cockpit_win_state, @cockpit_win_review, the counts).
#
# A comma inside #[...] within #{?...} would end the branch, so styles inside a
# conditional are written as separate #[fg=...]#[bold] blocks.

# --- palette -----------------------------------------------------------------
# Hex roles, dark and light. cockpit-tui reads these; -o keeps yours.
set -goq @thm_bg            "#16181d"
set -goq @thm_bg_light      "#f7f7f5"
set -goq @thm_fg            "#e6e4df"
set -goq @thm_fg_light      "#1b1e24"
set -goq @thm_surface       "#2a2f3a"
set -goq @thm_surface_light "#e1e5ec"
set -goq @thm_dim           "#9097a3"
set -goq @thm_dim_light     "#5c626c"
set -goq @thm_accent        "#6cb6ff"
set -goq @thm_accent_light  "#0a5fc2"
set -goq @thm_needs         "#ff5f6d"
set -goq @thm_needs_light   "#c4122f"
set -goq @thm_error         "#ff9e3d"
set -goq @thm_error_light   "#9a4c00"
set -goq @thm_running       "#e6c84f"
set -goq @thm_running_light "#806200"
set -goq @thm_done          "#5fd38d"
set -goq @thm_done_light    "#1d7439"
set -goq @thm_review        "#5fd3d3"
set -goq @thm_review_light  "#00737a"
set -goq @thm_sel           "#3a4252"
set -goq @thm_sel_light     "#c8d1df"
set -goq @thm_faint         "#717885"
set -goq @thm_faint_light   "#7c828c"

# tmux 3.8's ten theme slots, each a format reading its role, so every client gets
# its own light or dark set and a 16-colour client gets ANSI. The slots follow
# stock use: menus and popups draw on dark-grey (surface), borders in light-grey
# (dim), and a marked pane in magenta (review, not error). `set -g theme
# terminal` turns them off. With @cockpit_statusbar off your own slots stay.
%if "#{!=:#{@cockpit_statusbar},off}"
set -s dark-theme-black        "#{?#{e|>=:#{client_colours},256},#{@thm_bg},black}"
set -s light-theme-black       "#{?#{e|>=:#{client_colours},256},#{@thm_bg_light},black}"
set -s dark-theme-white        "#{?#{e|>=:#{client_colours},256},#{@thm_fg},white}"
set -s light-theme-white       "#{?#{e|>=:#{client_colours},256},#{@thm_fg_light},white}"
set -s dark-theme-dark-grey    "#{?#{e|>=:#{client_colours},256},#{@thm_surface},brightblack}"
set -s light-theme-dark-grey   "#{?#{e|>=:#{client_colours},256},#{@thm_surface_light},brightblack}"
set -s dark-theme-light-grey   "#{?#{e|>=:#{client_colours},256},#{@thm_dim},white}"
set -s light-theme-light-grey  "#{?#{e|>=:#{client_colours},256},#{@thm_dim_light},white}"
set -s dark-theme-blue         "#{?#{e|>=:#{client_colours},256},#{@thm_accent},blue}"
set -s light-theme-blue        "#{?#{e|>=:#{client_colours},256},#{@thm_accent_light},blue}"
set -s dark-theme-red          "#{?#{e|>=:#{client_colours},256},#{@thm_needs},red}"
set -s light-theme-red         "#{?#{e|>=:#{client_colours},256},#{@thm_needs_light},red}"
set -s dark-theme-cyan         "#{?#{e|>=:#{client_colours},256},#{@thm_error},magenta}"
set -s light-theme-cyan        "#{?#{e|>=:#{client_colours},256},#{@thm_error_light},magenta}"
set -s dark-theme-yellow       "#{?#{e|>=:#{client_colours},256},#{@thm_running},yellow}"
set -s light-theme-yellow      "#{?#{e|>=:#{client_colours},256},#{@thm_running_light},yellow}"
set -s dark-theme-green        "#{?#{e|>=:#{client_colours},256},#{@thm_done},green}"
set -s light-theme-green       "#{?#{e|>=:#{client_colours},256},#{@thm_done_light},green}"
set -s dark-theme-magenta      "#{?#{e|>=:#{client_colours},256},#{@thm_review},cyan}"
set -s light-theme-magenta     "#{?#{e|>=:#{client_colours},256},#{@thm_review_light},cyan}"
%endif

# --- shared formats ------------------------------------------------------------
# For a bar of your own too: #{E:@cockpit_where_path}, #{E:@cockpit_where_branch}
# and #{E:@cockpit_fleet}. Only an ssh pane runs a shell on redraw (a #() in the
# untaken #{?} branch never runs), and it gets only pane_pid and pane_id, which
# no path can look like. exec: dash forks before running the job's one command.
set -g @cockpit_where_path "#{?#{==:#{pane_current_command},ssh},#(exec #{@cockpit_where_cmd} path #{pane_pid} #{pane_id}),#{s|^#{@cockpit_home_re}/|~/|:#{s|^#{@cockpit_home_re}$|~|:pane_current_path}}}"
set -g @cockpit_where_branch "#{?#{==:#{pane_current_command},ssh},,#{@cockpit_branch}}"
# Touch: @cockpit_touch on, or auto (unset) on a client under 100 columns.
set -g @cockpit_is_touch "#{||:#{==:#{@cockpit_touch},on},#{&&:#{!=:#{@cockpit_touch},off},#{e|<:#{client_width},100}}}"
set -g @cockpit_is_agent "#{m/i:*|#{b:pane_current_command}|*,#{@cockpit_agents_glob}}"
# A pane's state is believed only while it runs an agent: a crashed one fires no hook.
set -g @cockpit_pstate "#{?#{E:@cockpit_is_agent},#{@panestate},}"
set -g @cockpit_i_menu "#{?#{==:#{@cockpit_icons},nerd},,#{?#{==:#{@cockpit_icons},ascii},=,≡}}"
set -g @cockpit_i_branch "#{?#{==:#{@cockpit_icons},nerd}, ,#{?#{==:#{@cockpit_icons},ascii},git:,⎇ }}"
# Another session waits (w) or, with nothing waiting, has failed (e): the fleet
# count minus this session's own, so no redraw walks the sessions.
set -g @cockpit_away "#{?#{e|>:#{e|-:#{@cockpit_fleet_nb},#{@cockpit_sess_nb}},0},w,#{?#{e|>:#{e|-:#{@cockpit_fleet_ne},#{@cockpit_sess_ne}},0},e,}}"

%if "#{!=:#{@cockpit_statusbar},off}"
# --- the window line: window tabs only --------------------------------------------
set -g status-style "bg=themeblack,fg=themewhite"
set -g window-status-separator ""
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-last-style default
set -g window-status-bell-style default
set -g window-status-activity-style default
set -g @cockpit_glyph "#{?#{==:#{@cockpit_win_state},needs-input},#[fg=themered]▲,#{?#{==:#{@cockpit_win_state},error},#[fg=themecyan]✕,#{?#{==:#{@cockpit_win_state},running},#[fg=themeyellow]●,#{?#{==:#{@cockpit_win_state},done},#[fg=themegreen]✓,#{?#{==:#{@cockpit_win_state},idle},#[fg=themelightgrey]○,}}}}}"
set -g @cockpit_marks "#{?#{@cockpit_win_state}, #{E:@cockpit_glyph},}#{?#{@cockpit_win_review}, #[fg=thememagenta]◆,}"
# An agent's topic, else the window name. pane_title defaults to the host name,
# which most agents but Claude leave alone: that is no topic.
set -g @cockpit_label "#{?#{E:@cockpit_is_agent},#{?#{@cockpit_title},#{@cockpit_title},#{?#{==:#{pane_title},#{host_short}},#W,#{s/^✳ //:#{pane_title}}}},#W}"
# The context gauge (scripts/agent-context): ◔NN% once the window's active agent
# has filled 80% of its context; a compact tab shows the bare ◔. It adds to a
# tab's width, so the budget below takes off the session's gauge cells,
# @cockpit_ctx_all, which agent-context sums when a fill changes: a walk of the
# windows inside every tab's format blanked a 36-window status line.
set -g @cockpit_ctx_on "#{&&:#{E:@cockpit_is_agent},#{e|>=:#{@panestate_ctx},80}}"
set -g @cockpit_ctx "#{?#{E:@cockpit_ctx_on}, #[fg=themewhite]◔#{@panestate_ctx}%,}"
# Tab budget from the real width, less the gauges. The current tab gets
# (W - reserve)/n - 6, clamped to 12..cap; the others share the rest and go
# compact (number and marks) below 4 cells. The reserve is 2, or 8 for touch's ‹ ›.
set -g @cockpit_tab_cap "#{?#{e|>=:#{client_width},160},28,18}"
set -g @cockpit_tab_reserve "#{?#{E:@cockpit_is_touch},8,2}"
set -g @cockpit_tab_room "#{e|-:#{e|-:#{client_width},#{E:@cockpit_tab_reserve}},#{@cockpit_ctx_all}}"
set -g @cockpit_cur_raw "#{e|-:#{e|/:#{E:@cockpit_tab_room},#{session_windows}},6}"
set -g @cockpit_cur_w "#{?#{e|<:#{E:@cockpit_cur_raw},12},12,#{?#{e|>:#{E:@cockpit_cur_raw},#{E:@cockpit_tab_cap}},#{E:@cockpit_tab_cap},#{E:@cockpit_cur_raw}}}"
set -g @cockpit_others "#{?#{e|>:#{session_windows},1},#{e|-:#{session_windows},1},1}"
set -g @cockpit_tab_raw "#{e|-:#{e|/:#{e|-:#{E:@cockpit_tab_room},#{e|+:#{E:@cockpit_cur_w},8}},#{E:@cockpit_others}},6}"
set -g @cockpit_narrow "#{e|<:#{E:@cockpit_tab_raw},4}"
set -g @cockpit_tab_w "#{?#{e|>:#{E:@cockpit_tab_raw},#{E:@cockpit_tab_cap}},#{E:@cockpit_tab_cap},#{E:@cockpit_tab_raw}}"
# A cut label never leaves a space before its …
set -g @cockpit_tab_label "#{s/ +…$/…/:#{=/#{E:@cockpit_tab_w}/…:#{E:@cockpit_label}}}"
set -g @cockpit_cur_label "#{s/ +…$/…/:#{=/#{E:@cockpit_cur_w}/…:#{E:@cockpit_label}}}"
# A compact tab on touch is padded to 5 cells, a thumb's minimum.
set -g window-status-format "#[fg=#{?#{==:#{@cockpit_win_state},needs-input},themered,themelightgrey}] #I#{?#{E:@cockpit_narrow},, #{E:@cockpit_tab_label}}#{E:@cockpit_marks}#{?#{E:@cockpit_narrow},#{?#{E:@cockpit_ctx_on}, #[fg=themewhite]◔,},#{E:@cockpit_ctx}}#{?#{&&:#{E:@cockpit_narrow},#{&&:#{E:@cockpit_is_touch},#{!:#{||:#{||:#{@cockpit_win_state},#{@cockpit_win_review}},#{E:@cockpit_ctx_on}}}}},  ,} #[default]"
# The current tab's number is accent and bold: the fill alone is 1.18:1 on light.
set -g window-status-current-format "#[bg=themedarkgrey]#[fg=themeblue]#[bold] #I #[fg=themewhite]#{E:@cockpit_cur_label}#{E:@cockpit_marks}#{E:@cockpit_ctx} #[default]"
# Touch: ‹ › step through the windows. Dim, white while windows lie beyond on
# that side, red with ▲ while a waiting one does. "Beyond" is estimated from the
# tab budget: the list overflows and the window is before (after) the current.
set -g @cockpit_overflow "#{e|>:#{e|+:#{e|*:#{E:@cockpit_others},#{?#{E:@cockpit_narrow},5,#{e|+:#{E:@cockpit_tab_w},6}}},#{e|+:#{E:@cockpit_cur_w},8}},#{E:@cockpit_tab_room}}"
set -g @cockpit_win_before "#{W:#{?#{e|<:#{window_index},#{active_window_index}},x,}}"
set -g @cockpit_win_after "#{W:#{?#{e|>:#{window_index},#{active_window_index}},x,}}"
set -g @cockpit_wait_before "#{W:#{?#{&&:#{e|<:#{window_index},#{active_window_index}},#{==:#{@cockpit_win_state},needs-input}},x,}}"
set -g @cockpit_wait_after "#{W:#{?#{&&:#{e|>:#{window_index},#{active_window_index}},#{==:#{@cockpit_win_state},needs-input}},x,}}"
set -g status-left-length 5
set -g status-right-length 5
set -g status-left "#{?#{E:@cockpit_is_touch},#[range=user|cp-prev]#{?#{&&:#{E:@cockpit_overflow},#{E:@cockpit_wait_before}},#[fg=themered]#[bold] ‹▲,#{?#{&&:#{E:@cockpit_overflow},#{E:@cockpit_win_before}},#[fg=themewhite]#[bold],#[fg=themelightgrey]} ‹ }#[norange]#[default],}"
set -g status-right "#{?#{E:@cockpit_is_touch},#[range=user|cp-next]#{?#{&&:#{E:@cockpit_overflow},#{E:@cockpit_wait_after}},#[fg=themered]#[bold]▲› ,#{?#{&&:#{E:@cockpit_overflow},#{E:@cockpit_win_after}},#[fg=themewhite]#[bold],#[fg=themelightgrey]} › }#[norange]#[default],}"

# --- the top border ----------------------------------------------------------------
# On for every window, so path and branch have one home; prefix e hides it.
setw -g pane-border-status top
setw -g pane-border-lines single
setw -g pane-scrollbars auto-hide
set -g pane-border-style        "fg=#{?#{==:#{E:@cockpit_pstate},needs-input},themered,#{?#{==:#{E:@cockpit_pstate},error},themecyan,themelightgrey}}"
set -g pane-active-border-style "fg=#{?#{==:#{E:@cockpit_pstate},needs-input},themered,#{?#{==:#{E:@cockpit_pstate},error},themecyan,themeblue}}"

# The corner, on the top-left pane (or the zoomed one): ≡ opens the menu
# (control|1); the session name and the elsewhere mark open the session picker
# (control|0). While the prefix is held (client_prefix) the ≡ cell turns into
# a reversed accent block, same width, so a held prefix shows. Touch pads both
# when the pane has 40 columns for it.
set -g @cockpit_corner "#{||:#{&&:#{pane_at_left},#{pane_at_top}},#{&&:#{window_zoomed_flag},#{pane_active}}}"
set -g @cockpit_big "#{&&:#{E:@cockpit_is_touch},#{e|>=:#{pane_width},40}}"
set -g @cockpit_name_w "#{?#{e|>:#{n:session_name},20},20,#{n:session_name}}"
set -g @cockpit_name_room "#{e|-:#{pane_width},#{?#{E:@cockpit_big},26,20}}"
set -g @cockpit_name_fit "#{?#{e|>:#{E:@cockpit_name_w},#{E:@cockpit_name_room}},#{?#{e|<:#{E:@cockpit_name_room},6},6,#{E:@cockpit_name_room}},#{E:@cockpit_name_w}}"
# "▲ elsewhere" while the pane has room for the word, else the bare mark.
set -g @cockpit_mark_word "#{e|>=:#{pane_width},#{e|+:#{E:@cockpit_name_fit},#{?#{E:@cockpit_is_touch},46,32}}}"
set -g @cockpit_mark_w "#{?#{E:@cockpit_away},#{e|+:#{?#{E:@cockpit_mark_word},12,2},#{?#{E:@cockpit_big},2,1}},1}"
set -g @cockpit_away_mark "#{?#{==:#{E:@cockpit_away},w},#[fg=themered]#[bold]▲#{?#{E:@cockpit_mark_word}, elsewhere,},#[fg=themecyan]#[bold]✕#{?#{E:@cockpit_mark_word}, elsewhere,}}"
set -g @cockpit_corner_w "#{?#{E:@cockpit_corner},#{e|+:#{e|+:#{?#{E:@cockpit_big},6,4},#{e|+:#{E:@cockpit_name_fit},#{?#{E:@cockpit_big},4,2}}},#{E:@cockpit_mark_w}},0}"
set -g @cockpit_corner_fmt "#[range=control|1]#{?client_prefix,#[fg=themeblue]#[reverse],#[fg=themewhite]}#{?#{E:@cockpit_big},  #{E:@cockpit_i_menu}  , #{E:@cockpit_i_menu} }#[norange]#[default]─#[range=control|0]#[fg=themeblack]#[bg=themeblue]#[bold]#{?#{E:@cockpit_big},  , }#{=/#{E:@cockpit_name_fit}/…:session_name}#{?#{E:@cockpit_big},  , }#[bg=default]#{?#{E:@cockpit_away}, #{E:@cockpit_away_mark}#{?#{E:@cockpit_big},  , },}#[norange]#[default]"

# The active pane's right end: path (control|2, opens the folder in the editor), branch
# (control|3, the branch popup) and, on a split, [z] (stock control|8). A
# waiting pane's question comes first; the branch and then the path get what is
# left, the path dropped first. The path never takes room the branch could use.
set -g @cockpit_zoom_w "#{?#{&&:#{pane_active},#{e|>:#{window_panes},1}},7,0}"
set -g @cockpit_avail "#{e|-:#{e|-:#{e|-:#{pane_width},6},#{E:@cockpit_corner_w}},#{E:@cockpit_zoom_w}}"
set -g @cockpit_waiting "#{==:#{E:@cockpit_pstate},needs-input}"
set -g @cockpit_ask_w "#{?#{E:@cockpit_waiting},#{?#{e|<:#{E:@cockpit_avail},#{n:@panestate_msg}},#{?#{e|<:#{E:@cockpit_avail},10},10,#{E:@cockpit_avail}},#{n:@panestate_msg}},0}"
set -g @cockpit_rest "#{e|-:#{e|-:#{E:@cockpit_avail},#{E:@cockpit_ask_w}},#{?#{E:@cockpit_waiting},3,0}}"
set -g @cockpit_branch_len "#{n:#{E:@cockpit_where_branch}}"
set -g @cockpit_branch_w "#{?#{E:@cockpit_where_branch},#{?#{e|>=:#{E:@cockpit_rest},#{e|+:#{E:@cockpit_branch_len},3}},#{E:@cockpit_branch_len},#{?#{e|>=:#{E:@cockpit_rest},11},#{e|-:#{E:@cockpit_rest},3},0}},0}"
set -g @cockpit_rest2 "#{e|-:#{E:@cockpit_rest},#{?#{e|>:#{E:@cockpit_branch_w},0},#{e|+:#{E:@cockpit_branch_w},3},0}}"
set -g @cockpit_path_len "#{n:#{E:@cockpit_where_path}}"
set -g @cockpit_path_w "#{?#{||:#{e|>:#{E:@cockpit_branch_w},0},#{!:#{E:@cockpit_where_branch}}},#{?#{e|>=:#{E:@cockpit_rest2},10},#{?#{e|<:#{e|-:#{E:@cockpit_rest2},1},#{E:@cockpit_path_len}},#{e|-:#{E:@cockpit_rest2},1},#{E:@cockpit_path_len}},0},0}"
# Read by the menu too: Browse folder and Switch branch show only when their
# target is not on the border, and a border hidden by prefix e shows nothing.
set -g @cockpit_path_shown "#{&&:#{!=:#{pane-border-status},off},#{e|>:#{E:@cockpit_path_w},0}}"
set -g @cockpit_branch_shown "#{&&:#{!=:#{pane-border-status},off},#{e|>:#{E:@cockpit_branch_w},0}}"
set -g @cockpit_border_right "#{?pane_active,#[align=right]#{?#{E:@cockpit_path_shown},#[range=control|2]#[fg=themelightgrey]#{=/-#{E:@cockpit_path_w}/…:#{E:@cockpit_where_path}} #[norange]#[default],}#{?#{E:@cockpit_branch_shown},#[range=control|3]#[fg=themeblue]#{E:@cockpit_i_branch}#{=/#{E:@cockpit_branch_w}/…:#{E:@cockpit_where_branch}} #[norange]#[default],}#{?#{e|>:#{window_panes},1},#[range=control|8]#[fg=themewhite]#{?window_zoomed_flag,#[bold] [u] ,  [z]  }#[norange]#[default],},}"
# Any other pane: its glyph and title, dim. A cut question or title is flush
# with its …, as on the tabs.
set -g @cockpit_title_w "#{e|-:#{e|-:#{pane_width},6},#{E:@cockpit_corner_w}}"
set -g pane-border-format "#{?#{E:@cockpit_corner},#{E:@cockpit_corner_fmt},}#{?#{E:@cockpit_waiting}, #[fg=themered]#[bold]▲ #[nobold]#{s/ +…$/…/:#{=/#{?pane_active,#{E:@cockpit_ask_w},#{E:@cockpit_title_w}}/…:@panestate_msg}}#[default] ,#{?#{==:#{E:@cockpit_pstate},error}, #[fg=themecyan]#[bold]✕ error#[default] ,#{?pane_active,, #{?#{==:#{E:@cockpit_pstate},running},#[fg=themeyellow]● ,#{?#{==:#{E:@cockpit_pstate},done},#[fg=themegreen]✓ ,#{?#{E:@cockpit_is_agent},#[fg=themelightgrey]○ ,}}}#[fg=themelightgrey]#{s/ +…$/…/:#{=/#{E:@cockpit_title_w}/…:#{?#{E:@cockpit_is_agent},#{?#{@cockpit_title},#{@cockpit_title},#{?#{==:#{pane_title},#{host_short}},#{pane_current_command},#{s/^✳ //:#{pane_title}}}},#{pane_current_command}}}}#[default] }}}#{E:@cockpit_border_right}"
%endif
