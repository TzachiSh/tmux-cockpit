# ~/.tmux.conf

# --- prefix: Ctrl-Space ------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix     # press twice to send a literal Ctrl-Space through

# --- sane defaults -----------------------------------------------------------
set  -g mouse on                 # click panes, drag borders, scroll
set  -g base-index 1             # windows count from 1
setw -g pane-base-index 1
set  -g renumber-windows on      # no gaps after closing a window
set -sg escape-time 0            # kills the Esc lag inside vim
set  -g history-limit 50000
set  -g display-time 2000
set  -g focus-events on
setw -g mode-keys vi             # v = select, y = copy in copy mode
set  -g set-clipboard on         # OSC52: copy reaches the system clipboard

set  -g default-terminal "tmux-256color"
# truecolor + extended keys. One -g assignment: -as would stack a copy per reload.
set -g terminal-features "xterm-256color:RGB:extkeys,*256col*:RGB,xterm*:extkeys"
# Stops a terminal that wraps at the last cell from stacking ghost rows (#97).
# The guard keeps a reload from appending a second copy.
if -F "#{!=:#{m:*xterm-256color:am@*,#{terminal-overrides}},1}" {
  set -as terminal-overrides ",xterm-256color:am@"
}

# Size windows to the smallest client, so a narrower one is not over-drawn (#144).
set -g window-size smallest

# --- AI coding agents ---------------------------------------------------------
set -g allow-passthrough on   # agents' notifications + OSC 7 reach the terminal
set -s extended-keys always   # without it tmux folds Shift+Enter into Enter
set -g visual-bell off        # bell marks the window; no overlay over your work
set -g bell-action any
set -g activity-action none   # agents print constantly; activity means nothing

# Default naming (the running command). Not #{b:pane_current_path}: windows in
# one repo would all get the same name.
set -g automatic-rename on

# The outer terminal title stays off: every agent title change is forwarded
# uncoalesced, which can freeze a slow terminal (Windows Terminal). To enable it
# on one that coalesces (Ghostty, kitty, iTerm2), use the two lines below:
set -g set-titles off
#   set -g set-titles on
#   set -g set-titles-string "#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{@cockpit_title},#{@cockpit_title},#{s/^✳ //:#{pane_title}}},#S:#I #W}"

# --- splits: | and -, opening in the current directory ------------------------
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"   # unshifted alias for |
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"
unbind '"'
unbind %

# --- move between panes with Alt+arrows, no prefix ----------------------------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# vim-style with the prefix, held for repeat
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# resize, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- pane layout: v toggles stacked / side-by-side ----------------------------
# One lowercase key: a Shift-letter chord dies under Caps Lock or a non-Latin layout.
# The window's first bracket says which way it is split: [ stacked.
bind v if-shell -F '#{m/r:^[^{[]*\[,#{window_layout}}' 'select-layout even-horizontal' 'select-layout even-vertical'

# --- copy mode: v / y like vim ------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# The session picker is prefix + s, bound by the plugin; prefix + f is its side fix.

# prefix + w is the board, every agent pane as a live tile. It needs the optional
# bin/cockpit-tui (scripts/tui-fetch installs it).
#   set -g @cockpit_board_key off     # keep stock choose-tree
#   set -g @cockpit_board_window on   # a parked window instead of the popup
#   set -g @cockpit_tui_version cockpit-tui-v0.1.0
# Fetch the binary on plugin load; opt-in, since that also runs on every reload:
#   set -g @cockpit_tui_fetch on

# prefix + e hides the status line and pane borders for this session and window.
#   set -g @cockpit_fullscreen_key off   # keep stock tmux (e is unbound there)

# The pickers are bound by the plugin; only the click target, #[range=control|1]
# on the branch segment, has to live here, since this file owns status-right.

# --- prefix + m : action menu -------------------------------------------------
# Overrides the stock 'm' (mark-pane).
# ##{...}: the inner command expands the item a second time, so a quote in a path
# or title must reach that pass as data, never as tmux or sh syntax.
# Picker rows replay the plugin's key; a row whose name is empty is dropped.
bind m display-menu -T "#[align=centre]#{session_name}" -x C -y C \
  "Split right"      \\  "split-window -h -c '##{pane_current_path}'" \
  "Split down"       -   "split-window -v -c '##{pane_current_path}'" \
  "Zoom / unzoom"    z   "resize-pane -Z" \
  "Stack / side-by-side" v "switch-client -T prefix ; send-keys -K v" \
  "Kill pane"        x   "confirm-before -p 'kill pane ##P? (y/n)' kill-pane" \
  "" \
  "New window"       c   "new-window -c '##{pane_current_path}'" \
  "Rename window"    ,   "command-prompt -I '##W' 'rename-window \"%%\"'" \
  "#{?#{==:#{@cockpit_move_key},off},,Move window...}" m "switch-client -T prefix ; send-keys -K '#{?#{@cockpit_move_key},#{@cockpit_move_key},M}'" \
  "Kill window"      X   "confirm-before -p 'kill window ##W? (y/n)' kill-window" \
  "" \
  "What is each agent doing?" t \
     "display-popup -E -w 78% -h 40% \"tmux list-panes -a -F '##{window_index}  ##{?##{m:*|##{pane_current_command}|*,##{@cockpit_agents_glob}},##{@panestate},-}  ##{pane_title}' | column -t -s'  ' ; read -n1 -s\"" \
  "" \
  "Switch branch"    b   "switch-client -T prefix ; send-keys -K b" \
  "#{?#{==:#{@cockpit_sessions_key},off},,Sessions...}" s "switch-client -T prefix ; send-keys -K '#{?#{@cockpit_sessions_key},#{@cockpit_sessions_key},s}'" \
  "Rename session"   $   "command-prompt -I '##S' 'rename-session \"%%\"'" \
  "Detach"           d   "detach-client" \
  "" \
  "Reload config"    r   "switch-client -T prefix ; send-keys -K R" \
  "Kill session"     Q   "confirm-before -p 'kill session ##S? (y/n)' kill-session"

# --- reload -------------------------------------------------------------------
# cockpit binds prefix + r (review) and prefix + R (reload) itself;
# @cockpit_review_key and @cockpit_reload_key rebind either, "off" disables.

# --- plugins (tpm) ------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# tmux-cockpit is loaded by the run-shell line further down. catppuccin is not
# listed: tpm would run it after this file and clobber the overrides below.
# update it with: git -C ~/.tmux/plugins/tmux pull

set -g @catppuccin_flavor 'mocha'   # v2 spells it 'flavor'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'          # restore the last session on tmux start
set -g @continuum-save-interval '15'    # minutes

# Load the theme first so its status modules exist. source-file, not run:
# 'run' is asynchronous and would land after the overrides below.
source -F ~/.tmux/plugins/tmux/catppuccin_options_tmux.conf

# Window label: the agent's conversation topic, else the window name. Both tabs
# share the @cockpit_tab_w budget below. Must sit between the two source files:
# the first unsets these vars, the second bakes them into window-status-format.
# --- one palette for terminal and tmux ----------------------------------------
# Between the two catppuccin sources: the first defines @thm_*, the second bakes
# them into every format. These match the claude-readable Ghostty theme.
set -g @thm_bg        "#1a1c24"
set -g @thm_fg        "#f2efea"
set -g @thm_surface_0 "#262b35"
set -g @thm_surface_1 "#313747"
set -g @thm_surface_2 "#3c4356"
set -g @thm_overlay_0 "#5b6272"
set -g @thm_overlay_1 "#6b7285"
set -g @thm_overlay_2 "#9aa2b5"
set -g @thm_red       "#ff6b6b"
set -g @thm_maroon    "#ff8c8c"
set -g @thm_peach     "#ff9838"
set -g @thm_yellow    "#ffcc33"
set -g @thm_green     "#3dea7d"
set -g @thm_teal      "#22eaea"
set -g @thm_sky       "#66aeff"
set -g @thm_blue      "#66aeff"
set -g @thm_lavender  "#9ccfff"
set -g @thm_mauve     "#c9a2ff"
set -g @thm_pink      "#e07bff"

# A marker per window tab, by shape as well as colour for colourblind readers:
# ▲ blocked, ✕ error, ● running, ✓ done, ○ idle. It reads @cockpit_win_state,
# the worst state in the window, which scripts/agent-state precomputes.
# The label width is the client minus 61 columns of chrome, split over the
# windows and clamped to 10..34; a format, since two clients can differ.
set -g @cockpit_tab_w "#{?#{e|<:#{e|/:#{e|-:#{client_width},61},#{session_windows}},10},10,#{?#{e|>:#{e|/:#{e|-:#{client_width},61},#{session_windows}},34},34,#{e|/:#{e|-:#{client_width},61},#{session_windows}}}}"
# %%%%: tmux 3.8 blanks the whole tab on a bare % inside #{?...}.
set -g @catppuccin_window_text " #{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{==:#{pane_title},#{host_short}},#{=/#{E:@cockpit_tab_w}/…:#{window_name}},#{=/#{E:@cockpit_tab_w}/…:#{?#{@cockpit_title},#{@cockpit_title},#{s/^✳ //:#{pane_title}}}}},#W} #{?#{==:#{@cockpit_win_state},needs-input},#[fg=#{@thm_red}]▲,#{?#{==:#{@cockpit_win_state},error},#[fg=#{@thm_peach}]✕,#{?#{==:#{@cockpit_win_state},running},#[fg=#{@thm_yellow}]●,#{?#{==:#{@cockpit_win_state},done},#[fg=#{@thm_green}]✓,#{?#{==:#{@cockpit_win_state},idle},#[fg=#{@thm_overlay_0}]○,}}}}}#{?#{e|>=:#{@panestate_ctx},80},#[fg=#{@thm_mauve}] ◔#{@panestate_ctx}%%%%,}"
set -g @catppuccin_window_current_text " #{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{==:#{pane_title},#{host_short}},#{=/#{E:@cockpit_tab_w}/…:#{window_name}},#{=/#{E:@cockpit_tab_w}/…:#{?#{@cockpit_title},#{@cockpit_title},#{s/^✳ //:#{pane_title}}}}},#W} #{?#{==:#{@cockpit_win_state},needs-input},#[fg=#{@thm_red}]▲,#{?#{==:#{@cockpit_win_state},error},#[fg=#{@thm_peach}]✕,#{?#{==:#{@cockpit_win_state},running},#[fg=#{@thm_yellow}]●,#{?#{==:#{@cockpit_win_state},done},#[fg=#{@thm_green}]✓,#{?#{==:#{@cockpit_win_state},idle},#[fg=#{@thm_overlay_0}]○,}}}}}#{?#{e|>=:#{@panestate_ctx},80},#[fg=#{@thm_mauve}] ◔#{@panestate_ctx}%%%%,}"

source -F ~/.tmux/plugins/tmux/catppuccin_tmux.conf

# After the catppuccin source, which sets these itself. fg too, or text no
# picker paints goes default on black.
set -g popup-border-lines rounded
set -g popup-border-style "fg=#{@thm_overlay_0}"
set -g popup-style        "bg=#{@thm_bg},fg=#{@thm_fg}"

# --- agent state, rendered natively by tmux -----------------------------------
# @panestate is written by Claude Code hooks via scripts/agent-state; everything
# below is a plain tmux format, so a redraw spawns no shell.
set -g pane-border-status top

# The border takes the state colour, believed only while the pane runs an agent:
# a killed or crashed agent fires no hook and would stay lit forever.
set -g pane-border-style        "fg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-active-border-style "fg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"

# Only the state that needs action gets words. The question is cut to 24 columns
# under 80 wide, 48 above, so it never pushes off the [z] and [x] buttons.
set -g pane-border-format "#{?#{&&:#{pane_active},#{!=:#{S:#{W:#{?window_active,,#{?#{@cockpit_win_needs},#{window_index}:#{window_name} ,}}}},}},#[fg=#{@thm_red}]#[bold]─ NEEDS YOU #{S:#{W:#{?window_active,,#{?#{@cockpit_win_needs},#{window_index}:#{window_name} ,}}}}#[default],#{?pane_active,,#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#[fg=#{@thm_red}]#[bold]─ NEEDS YOU #{=/#{?#{e|<:#{pane_width},80},24,48}/…:#{@panestate_msg}}#[default],#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#[fg=#{@thm_peach}]#[bold]─ ERROR #[default],}}}}#{?#{mouse},#[align=right]#{?#{e|>:#{window_panes},1},#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange],}#[range=control|9][x]#[norange],}"

# A blocked pane gets a faint tint too, only while it runs an agent.
set -g window-style        "bg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@cockpit_blocked_bg},default}"
# Never on the focused pane: bg=default is needed, or it inherits window-style.
set -g window-active-style "bg=default"

# --- status bar ---------------------------------------------------------------
set -g status-interval 2
# Redraw the status line when focus moves, so path and branch are current.
set-hook -g after-select-pane   'refresh-client -S'
set-hook -g after-select-window 'refresh-client -S'
set-hook -g client-session-changed 'refresh-client -S'
# Not pane-focus-in: it fires on every terminal focus change. To restore it:
#   set-hook -g pane-focus-in 'refresh-client -S'
set -g status-left-length 40   # session name only; agent state is on the pane border
set -g status-right-length 140

# Path, or the ssh destination for a pane inside ssh.
set -g @catppuccin_directory_text "#{=/30/…:#{agent_where_path}}"

# git branch, in the gitmux slot without the gitmux binary.
set -g @catppuccin_gitmux_icon " "
set -g @catppuccin_gitmux_text "#{agent_where_branch}"

set -g  status-left  "#{E:@catppuccin_status_session}"

# The fleet counter (▲ blocked, ✕ errored, ◆ unreviewed, across every session)
# renders nothing when all is quiet.
set -g  status-right "#{agent_fleet}"

# control|2 on the directory opens the folder browser. Dropped under 100
# columns: tmux cuts status-right from the left, eating the window tabs.
set -ag status-right "#{?#{e|>=:#{client_width},100},#[range=control|2]#{E:@catppuccin_status_directory}#[norange],}"
# control|1 on the branch opens the branch picker. A control range has its own
# mouse key, so clicking the window list still selects a window.
set -ag status-right "#[range=control|1]#{E:@catppuccin_status_gitmux}#[norange]"
set -g @catppuccin_date_time_text " %H:%M"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Expands the #{agent_*} tokens and binds the cockpit keys. Must come after every
# option using an #{agent_*} token.
run-shell ~/.tmux/plugins/tmux-cockpit/cockpit.tmux

run '~/.tmux/plugins/tpm/tpm'           # keep this line last
