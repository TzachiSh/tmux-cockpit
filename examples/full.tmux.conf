# ~/.tmux.conf

# --- prefix: Ctrl-Space ------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix     # press twice to send a literal Ctrl-Space through

# --- sane defaults -----------------------------------------------------------
set  -g mouse on                 # click panes, drag borders, scroll
set  -g base-index 1             # windows count from 1
setw -g pane-base-index 1
set  -g renumber-windows on      # no gaps after closing a window
set -sg escape-time 0            # kills the Esc lag inside vim
set  -g history-limit 50000
set  -g display-time 2000
set  -g focus-events on
setw -g mode-keys vi             # v = select, y = copy in copy mode
set  -g set-clipboard on         # OSC52: copy reaches the system clipboard

set  -g default-terminal "tmux-256color"
# truecolor + extended keys. One -g assignment, never "set -as": -as appends, so
# re-sourcing this file used to stack duplicates every reload.
set -g terminal-features "xterm-ghostty:RGB:extkeys,xterm-256color:RGB:extkeys,*256col*:RGB,xterm*:extkeys"

# --- AI coding agents ---------------------------------------------------------
set -g allow-passthrough on   # agents' notifications + OSC 7 reach ghostty
set -s extended-keys always   # without it tmux folds Shift+Enter into Enter
set -g visual-bell off        # bell marks the window; no overlay over your work
set -g bell-action any
set -g activity-action none   # agents print constantly; activity means nothing

# Default naming (the running command). Do NOT set automatic-rename-format to
# #{b:pane_current_path}: windows in one repo all collapse to the same name.
set -g automatic-rename on

# The OUTER terminal title is left OFF, on purpose. set-titles on forwards every
# agent OSC-2 title change to the terminal as a distinct, UNCOALESCED sequence
# (measured under an agent title storm: 609 title OSCs, 27KB/3s; off = 0).
# Windows Terminal is documented-slow at high-frequency title updates: its read
# loop stalls, drains tmux slower, tmux's out-buffer crosses the per-client
# TTY_BLOCK backpressure limit and the client freezes. The in-tmux tab already
# reads #{pane_title} INTERNALLY (the window labels above), so the topic is not
# lost -- only the outer window-chrome title stops updating.
#
# To re-enable it on a terminal that is NOT title-storm-sensitive (Ghostty,
# kitty, iTerm2 all coalesce fine), uncomment both lines. #T is pane_title,
# which Claude Code sets to the conversation topic -- strip its "✳ " marker,
# same as the window tabs do.
set -g set-titles off
#   set -g set-titles on
#   set -g set-titles-string "#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{@cockpit_title},#{@cockpit_title},#{s/^✳ //:#{pane_title}}},#S:#I #W}"

# --- splits: | and -, opening in the current directory ------------------------
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"   # unshifted alias for |
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"
unbind '"'
unbind %

# --- move between panes with Alt+arrows, no prefix ----------------------------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# vim-style with the prefix, held for repeat
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# resize, repeatable
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- pane layout: v toggles stacked / side-by-side ----------------------------
# One lowercase key instead of V and B (#43): a Shift-letter chord binds the
# character the terminal sends, so it dies under Caps Lock or a non-Latin
# layout. The window's first bracket says which way it is split: [ stacked.
bind v if-shell -F '#{m/r:^[^{[]*\[,#{window_layout}}' 'select-layout even-horizontal' 'select-layout even-vertical'

# --- copy mode: v / y like vim ------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# The session picker is prefix + g, bound by the plugin (prefix + f is its
# side-fix key, so a bind f here would be overridden at the run-shell line).

# prefix + w is the board: every agent pane as a live tile, blocked ones first.
# It overrides stock choose-tree, needs tmux 3.7 and the optional
# bin/cockpit-tui (scripts/tui-fetch installs it; without it the key says so
# and prefix + r is still the fleet list). Its popup is 90% wide, not the
# pickers' 70%: a 70% popup on a 120-column terminal is one tile column wide.
# Its height is @cockpit_popup_height, the same as every other cockpit popup.
#   set -g @cockpit_board_key off     # keep stock choose-tree
#   set -g @cockpit_board_window on   # a parked window instead of the popup;
#                                     # this form works below tmux 3.7 too
#   set -g @cockpit_tui_version tui-v0.1.0
# tpm's prefix + U re-runs this plugin -- but so does every config reload, and
# from inside they look the same, so the fetch is opt-in rather than on the
# startup path:
#   set -g @cockpit_tui_fetch on

# The branch picker (Ctrl+click the branch, or prefix + b) and the path picker
# (Ctrl+double-click a line) are bound by tmux-cockpit itself, at the run-shell
# line near the bottom. The one
# thing the plugin cannot do from there is mark the click target, because this
# file owns status-right -- that is the #[range=control|1] on the branch segment.

# --- prefix + m : action menu -------------------------------------------------
# overrides the stock 'm' (mark-pane), which almost nobody uses
# ##{...} in an item command: display-menu expands the command as a format and
# then hands the result to the inner command, which expands it AGAIN -- as tmux
# syntax (split-window -c, display-popup -T) or through sh (the list-panes
# popup). A single #{pane_current_path}/#{pane_title} holding a quote ran
# commands on selection; ## leaves one #{...} for that inner pass, which expands
# it as data. -p #{pane_id} stays single (only sh sees it; %<digits> is inert).
bind m display-menu -T "#[align=centre]#{session_name}" -x C -y C \
  "Split right"      \\  "split-window -h -c '##{pane_current_path}'" \
  "Split down"       -   "split-window -v -c '##{pane_current_path}'" \
  "Zoom / unzoom"    z   "resize-pane -Z" \
  "Stack / side-by-side" v "switch-client -T prefix ; send-keys -K v" \
  "Kill pane"        x   "confirm-before -p 'kill pane ##P? (y/n)' kill-pane" \
  "" \
  "New window"       c   "new-window -c '##{pane_current_path}'" \
  "Rename window"    ,   "command-prompt -I '##W' 'rename-window \"%%\"'" \
  "Move window..."   m   "switch-client -T prefix ; send-keys -K '#{?#{@cockpit_move_key},#{@cockpit_move_key},M}'" \
  "Kill window"      X   "confirm-before -p 'kill window ##W? (y/n)' kill-window" \
  "" \
  "What is each agent doing?" t \
     "display-popup -E -w 78% -h 40% \"tmux list-panes -a -F '##{window_index}  ##{?##{m:*|##{pane_current_command}|*,##{@cockpit_agents_glob}},##{@panestate},-}  ##{pane_title}' | column -t -s'  ' ; read -n1 -s\"" \
  "" \
  "Switch branch"    b   "display-popup -E -w 70% -h 70% -T ' switch branch · ##{b:pane_current_path} ' '~/.local/bin/tmux-branch -p #{pane_id}'" \
  "Sessions..."      s   "run-shell 'tmux popup -E -w 60% -h 50% ~/.local/bin/tm'" \
  "Rename session"   $   "command-prompt -I '##S' 'rename-session \"%%\"'" \
  "Detach"           d   "detach-client" \
  "" \
  "Reload config"    r   "switch-client -T prefix ; send-keys -K R" \
  "Kill session"     Q   "confirm-before -p 'kill session ##S? (y/n)' kill-session"

# --- reload -------------------------------------------------------------------
# cockpit binds these itself: prefix + r reviews, prefix + R reloads (the file
# tmux actually loaded, so an XDG config works too). @cockpit_review_key and
# @cockpit_reload_key rebind either; "off" disables.

# --- plugins (tpm) ------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# tmux-cockpit is ours, not tpm's: loaded by the run-shell line further down.
# catppuccin is NOT listed here on purpose: tpm would re-run it asynchronously
# after this file, and its 'set -gq @catppuccin_gitmux_text' would clobber the
# override below. It is sourced explicitly further down instead.
# update it with: git -C ~/.tmux/plugins/tmux pull

set -g @catppuccin_flavor 'mocha'   # v2 spells it 'flavor'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'          # restore the last session on tmux start
set -g @continuum-save-interval '15'    # minutes

# load the theme FIRST so its status modules exist.
# source-file, NOT run: 'run' is asynchronous and would land AFTER the
# overrides below, silently undoing them.
source -F ~/.tmux/plugins/tmux/catppuccin_options_tmux.conf

# Window label: the Claude conversation TOPIC for an agent pane (Claude Code
# writes it to pane_title, which is also what Ghostty shows in its tab), falling
# back to the window name for everything else. With several agents running, what
# each one is working on beats three tabs all reading "claude".
# The tab you are IN gets room for the whole thing (34); the others are cut to
# 16, which is enough to tell them apart without eating the bar. tmux has no
# hover, so "full detail on demand" lives in the prefix+m menu instead.
# This MUST sit between the two source files: the options file unsets these vars,
# and the second file bakes their value into window-status-format immediately.
# --- one palette for terminal and tmux ----------------------------------------
# These MUST sit between the two catppuccin sources: the options file defines
# @thm_*, the second file bakes them into every format. Overriding here makes
# the status bar use the SAME colours as ~/.config/ghostty/themes/claude-readable,
# instead of mocha's pink-red and mint-green on a slightly different dark.
set -g @thm_bg        "#1a1c24"
set -g @thm_fg        "#f2efea"
set -g @thm_surface_0 "#262b35"
set -g @thm_surface_1 "#313747"
set -g @thm_surface_2 "#3c4356"
set -g @thm_overlay_0 "#5b6272"
set -g @thm_overlay_1 "#6b7285"
set -g @thm_overlay_2 "#9aa2b5"
set -g @thm_red       "#ff6b6b"
set -g @thm_maroon    "#ff8c8c"
set -g @thm_peach     "#ff9838"
set -g @thm_yellow    "#ffcc33"
set -g @thm_green     "#3dea7d"
set -g @thm_teal      "#22eaea"
set -g @thm_sky       "#66aeff"
set -g @thm_blue      "#66aeff"
set -g @thm_lavender  "#9ccfff"
set -g @thm_mauve     "#c9a2ff"
set -g @thm_pink      "#e07bff"

# A state marker per window tab, so every window reads at once -- not only the
# one you are looking at. SHAPE as well as colour (▲ blocked, ✕ error, ● running,
# ✓ done, ○ idle): a row of red/green dots is useless to a colourblind reader,
# and shape survives greyscale screenshots too.
# The dot reads @cockpit_win_state, one keyword per window that scripts/agent-state
# writes on each transition -- the worst agent state among the window's panes,
# ranked needs-input > error > running > done > idle. Deriving it live was a
# per-window #{P:} pane walk on every redraw; reading the option walks nothing.
set -g @catppuccin_window_text " #{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{==:#{pane_title},#{host_short}},#W,#{=/16/…:#{?#{@cockpit_title},#{@cockpit_title},#{s/^✳ //:#{pane_title}}}}},#W} #{?#{==:#{@cockpit_win_state},needs-input},#[fg=#{@thm_red}]▲,#{?#{==:#{@cockpit_win_state},error},#[fg=#{@thm_peach}]✕,#{?#{==:#{@cockpit_win_state},running},#[fg=#{@thm_yellow}]●,#{?#{==:#{@cockpit_win_state},done},#[fg=#{@thm_green}]✓,#{?#{==:#{@cockpit_win_state},idle},#[fg=#{@thm_overlay_0}]○,}}}}}"
set -g @catppuccin_window_current_text " #{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{==:#{pane_title},#{host_short}},#W,#{=/34/…:#{?#{@cockpit_title},#{@cockpit_title},#{s/^✳ //:#{pane_title}}}}},#W} #{?#{==:#{@cockpit_win_state},needs-input},#[fg=#{@thm_red}]▲,#{?#{==:#{@cockpit_win_state},error},#[fg=#{@thm_peach}]✕,#{?#{==:#{@cockpit_win_state},running},#[fg=#{@thm_yellow}]●,#{?#{==:#{@cockpit_win_state},done},#[fg=#{@thm_green}]✓,#{?#{==:#{@cockpit_win_state},idle},#[fg=#{@thm_overlay_0}]○,}}}}}"

source -F ~/.tmux/plugins/tmux/catppuccin_tmux.conf

# --- agent state, rendered natively by tmux -----------------------------------
# State is a per-pane option (@panestate) written by Claude Code hooks via
# scripts/agent-state. Everything below is plain tmux format syntax, so a redraw
# costs ZERO shell spawns -- and the option dies with its pane, so there is no
# stale state to collect. Needs tmux >= 3.3 (3.7 for the clickable branch segment).
set -g pane-border-status top

# The whole border line takes the state colour. The state is only believed while
# the pane is actually RUNNING an agent: hooks cannot fire if the agent is killed
# or crashes, which otherwise left a dead pane lit up forever. Checking
# pane_current_command costs nothing -- tmux already knows it. Colour is pre-attentive: you see
# which pane needs you without reading anything.
set -g pane-border-style        "fg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-active-border-style "fg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"

# Only the state that needs action gets words; everything else is colour alone.
set -g pane-border-format "#{?#{&&:#{pane_active},#{!=:#{S:#{W:#{?window_active,,#{?#{@cockpit_win_needs},#{window_index}:#{window_name} ,}}}},}},#[fg=#{@thm_red}]#[bold]─ NEEDS YOU #{S:#{W:#{?window_active,,#{?#{@cockpit_win_needs},#{window_index}:#{window_name} ,}}}}#[default],#{?pane_active,,#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#[fg=#{@thm_red}]#[bold]─ NEEDS YOU #[default],#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#[fg=#{@thm_peach}]#[bold]─ ERROR #[default],}}}}#{?#{mouse},#[align=right]#{?#{e|>:#{window_panes},1},#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange],}#[range=control|9][x]#[norange],}"

# A blocked pane also gets a faint warm tint across its whole background. This
# is the only state loud enough to earn it: everything else stays on the border
# alone. Same guard as the border -- a pane not actually running an agent is
# never tinted, so a crashed agent cannot leave the screen stained.
set -g window-style        "bg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@cockpit_blocked_bg},default}"
# The tint is an alert: never paint the pane you are already on. Explicit
# bg=default is load-bearing -- unset, the active pane inherits window-style.
set -g window-active-style "bg=default"

# --- status bar ---------------------------------------------------------------
set -g status-interval 2
# redraw the status line the moment focus moves, so path/branch are not stale
set-hook -g after-select-pane   'refresh-client -S'
set-hook -g after-select-window 'refresh-client -S'
set-hook -g client-session-changed 'refresh-client -S'
set-hook -g pane-focus-in       'refresh-client -S'
set -g status-left-length 40   # session name only; agent state is on the pane border
set -g status-right-length 140

# pane_current_path is tmux's LOCAL view, so a pane inside ssh reports the wrong
# host. panestate finds the ssh in the process tree and shows that instead.
set -g @catppuccin_directory_text "#{=/30/…:#{agent_where_path}}"

# git branch via plain git -- reuses the gitmux slot without the gitmux binary
set -g @catppuccin_gitmux_icon " "
set -g @catppuccin_gitmux_text "#{agent_where_branch}"

set -g  status-left  "#{E:@catppuccin_status_session}"

# The directory segment is a click target too: control|2 opens the folder
# browser at the pane's working dir, as control|1 on the branch opens the picker.
set -g  status-right "#[range=control|2]#{E:@catppuccin_status_directory}#[norange]"
# The branch segment is a click target: range=control|1 marks it, and the
# MouseDown1Control1 binding below opens the picker. A control range gets its OWN
# mouse key, so unlike range=user it does not take over MouseDown1Status -- which
# is still what selects a window when you click the window list.
set -ag status-right "#[range=control|1]#{E:@catppuccin_status_gitmux}#[norange]"
set -g @catppuccin_date_time_text " %H:%M"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Expands the #{agent_*} tokens above, and binds the branch picker and
# the Ctrl+double-click path picker. MUST come after every option using an #{agent_*} token.
run-shell ~/.tmux/plugins/tmux-cockpit/cockpit.tmux

run '~/.tmux/plugins/tpm/tpm'           # keep this line last
