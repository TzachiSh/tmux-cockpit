# Termux extra-keys rows with a ✦ Panel key that sends the tmux prefix + f, the
# cockpit panel (@cockpit_panel_key). Merge it into ~/.termux/termux.properties,
# then run: termux-reload-settings
# The prefix here is Ctrl+B (the tmux default); change "CTRL b" if you use another.
extra-keys = [['ESC','/','-','HOME','UP','END','PGUP'], \
              ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN'], \
              [{macro: "CTRL b f", display: "✦ Panel"}, 'KEYBOARD']]
