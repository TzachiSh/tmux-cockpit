# tmux-cockpit: the block to copy into ~/.tmux.conf.
# Everything here is native tmux format syntax -- no shell runs on redraw.
# Regenerated from a working config; tests/run.sh loads THIS file into a
# scratch tmux server and asserts against it, so it cannot drift again.

# Which commands count as an agent. cockpit.tmux sets this default if you do
# not, and every format below reads it -- so this is the one place to change
# when you run a CLI it does not know about. Never set it empty: tmux matches
# every command against an empty pattern.
#   set -g @cockpit_agents "^(claude|codex|aider|my-agent)$"

# The border keeps tmux's own right-aligned zoom (control|8) and kill
# (control|9) buttons: replacing pane-border-format wholesale had silently
# deleted them.
set -g pane-border-status top
set -g pane-border-style        "fg=#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-active-border-style "fg=#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-border-format "#{?#{&&:#{pane_active},#{!=:#{S:#{W:#{?window_active,,#{?#{m:*needs-input*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#{window_index}:#{window_name} ,}}}},}},─ NEEDS YOU #{S:#{W:#{?window_active,,#{?#{m:*needs-input*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#{window_index}:#{window_name} ,}}}},#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},needs-input},─ NEEDS YOU ,#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},error},─ ERROR ,}}}#{?#{mouse},#[align=right]#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange]#[range=control|9][x]#[norange],}"
# The blocked-pane tint is an ALERT, so it must never fire at the thing you are
# already looking at: window-style paints only panes that are NOT focused, and
# window-active-style pins the focused pane to the terminal default. The
# explicit bg=default is load-bearing -- left unset, the active pane inherits
# window-style and the tint lands on the pane you are busy answering, which is
# noise: the red border and the prompt itself already have your attention.
set -g window-style        "bg=#{?#{==:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},},needs-input},#241a1e,default}"
set -g window-active-style "bg=default"
set -g @catppuccin_window_text " #{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{?#{==:#{pane_title},#{host_short}},#W,#{=/12/…:#{s/^✳ //:#{pane_title}}}},#W} #{?#{m:*needs-input*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_green}]✓,#[fg=#{@thm_overlay_0}]○}}}}"
set -g @catppuccin_window_current_text " #{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{?#{==:#{pane_title},#{host_short}},#W,#{=/34/…:#{s/^✳ //:#{pane_title}}}},#W} #{?#{m:*needs-input*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{?#{m/r:#{@cockpit_agents},#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_green}]✓,#[fg=#{@thm_overlay_0}]○}}}}"
set -g @catppuccin_directory_text "#{=/30/…:#{agent_where_path}}"
set -g @catppuccin_gitmux_text "#{agent_where_branch}"

# Makes the branch segment clickable. cockpit.tmux binds MouseDown1Control1, but
# it cannot mark the range itself: status-right belongs to your config.
# Guarded because -a APPENDS: reloading ~/.tmux.conf would otherwise stack a
# second clickable segment onto the first, and a third on the next reload.
if -F "#{!=:#{m:*range=control|1*,#{status-right}},1}" {
  set -ag status-right "#[range=control|1]#{E:@catppuccin_status_gitmux}#[norange]"
}

# LAST. cockpit.tmux rewrites the #{agent_*} tokens above into the shell calls
# that answer them, so it has to run after the options that carry them exist --
# run-shell blocks the command queue, so loading it earlier means it reads
# options that are not set yet and silently leaves the raw token in your status
# bar. Keep this line below everything above, and before tpm.
run-shell ~/.tmux/plugins/tmux-cockpit/cockpit.tmux
