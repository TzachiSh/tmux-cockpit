# tmux-cockpit: the block to copy into ~/.tmux.conf.
# Everything here is native tmux format syntax -- no shell runs on redraw.
# Regenerated from a working config; tests/run.sh loads THIS file into a
# scratch tmux server and asserts against it, so it cannot drift again.

run-shell ~/.tmux/plugins/tmux-cockpit/cockpit.tmux

set -g pane-border-status top
set -g pane-border-style        "fg=#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-active-border-style "fg=#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-border-format "#{?#{&&:#{pane_active},#{!=:#{S:#{W:#{?window_active,,#{?#{m:*needs-input*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#{window_index}:#{window_name} ,}}}},}},─ NEEDS YOU #{S:#{W:#{?window_active,,#{?#{m:*needs-input*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#{window_index}:#{window_name} ,}}}},#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},needs-input},─ NEEDS YOU ,#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},error},─ ERROR ,}}}"
set -g window-style        "bg=#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},needs-input},#241a1e,default}"
set -g window-active-style "bg=#{?#{==:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},},needs-input},#241a1e,default}"
set -g @catppuccin_window_text " #{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{=/12/…:#{s/^✳ //:#{pane_title}}},#W} #{?#{m:*needs-input*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_green}]✓,#[fg=#{@thm_overlay_0}]○}}}}"
set -g @catppuccin_window_current_text " #{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{=/34/…:#{s/^✳ //:#{pane_title}}},#W} #{?#{m:*needs-input*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{?#{m/r:^(claude|codex|aider|cursor|opencode|gemini|crush)$,#{pane_current_command}},#{@panestate},} }},#[fg=#{@thm_green}]✓,#[fg=#{@thm_overlay_0}]○}}}}"
set -g @catppuccin_directory_text "#{=/30/…:#{agent_where_path}}"
set -g @catppuccin_gitmux_text "#{agent_where_branch}"

# Makes the branch segment clickable. cockpit.tmux binds MouseDown1Control1, but
# it cannot mark the range itself: status-right belongs to your config.
set -ag status-right "#[range=control|1]#{E:@catppuccin_status_gitmux}#[norange]"
