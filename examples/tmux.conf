# tmux-cockpit: the block to copy into ~/.tmux.conf.
# Everything here is native tmux format syntax -- no shell runs on redraw.
# Regenerated from a working config; tests/run.sh loads THIS file into a
# scratch tmux server and asserts against it, so it cannot drift again.

# Both click gestures are mouse events; without this they never fire.
set -g mouse on

# A phone terminal that wraps at the last cell scrolls once per full-width status
# repaint, stacking ghost rows (#97); am@ skips it, xterm-256color only.
# Guarded because -a APPENDS: a plain -g would drop tmux's own defaults, and an
# unguarded -as stacks another copy on every reload.
if -F "#{!=:#{m:*xterm-256color:am@*,#{terminal-overrides}},1}" {
  set -as terminal-overrides ",xterm-256color:am@"
}

# Which commands count as an agent. cockpit.tmux converts this to the glob
# list the formats match against (regex matching recompiles per evaluation and
# doubled the redraw cost). One place to change for a CLI it does not know.
# Never set it empty: an empty pattern matches every command.
#   set -g @cockpit_agents "^(claude|codex|aider|my-agent)$"

# prefix + w is the board: every agent pane as a live tile, blocked ones first.
# It needs tmux 3.7 and the optional bin/cockpit-tui (scripts/tui-fetch installs
# it); without the binary the key says so and prefix + r is still the fleet
# list. Its popup is 90% wide -- 70% of a 120-column terminal is one tile wide --
# and @cockpit_popup_height tall, like every other cockpit popup.
#   set -g @cockpit_board_key off     # keep stock choose-tree
#   set -g @cockpit_board_window on   # a parked window instead of the popup;
#                                     # this form works below tmux 3.7 too
#   set -g @cockpit_tui_fetch on      # let prefix + U (and any reload) fetch it

# The border keeps tmux's own right-aligned zoom (control|8) and kill
# (control|9) buttons: replacing pane-border-format wholesale had silently
# deleted them. A pane's OWN "NEEDS YOU"/"ERROR" words show only when the pane
# is not focused -- on the pane you are on, the prompt itself and the red
# border already say it (the same reasoning as the tint). The cross-window
# banner is unaffected: you cannot see that window at all.
set -g pane-border-status top
set -g pane-border-style        "fg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-active-border-style "fg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@thm_red},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#{@thm_peach},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},running},#{@thm_yellow},#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-border-format "#{?#{&&:#{pane_active},#{!=:#{S:#{W:#{?window_active,,#{?#{@cockpit_win_needs},#{window_index}:#{window_name} ,}}}},}},#[fg=#{@thm_red}]#[bold]─ NEEDS YOU #{S:#{W:#{?window_active,,#{?#{@cockpit_win_needs},#{window_index}:#{window_name} ,}}}}#[default],#{?pane_active,,#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#[fg=#{@thm_red}]#[bold]─ NEEDS YOU #{=/48/…:#{@panestate_msg}}#[default],#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},error},#[fg=#{@thm_peach}]#[bold]─ ERROR #[default],}}}}#{?#{mouse},#[align=right]#{?#{e|>:#{window_panes},1},#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange],}#[range=control|9][x]#[norange],}"
# The blocked-pane tint is an ALERT, so it must never fire at the thing you are
# already looking at. Its colour is @cockpit_blocked_bg (default #52303a): the
# old #241a1e measured 1.03:1 against Catppuccin Mocha -- invisible on the very
# theme these variable names come from -- and DARKER than most bases, reading
# as disabled rather than alarmed: window-style paints only panes that are NOT focused, and
# window-active-style pins the focused pane to the terminal default. The
# explicit bg=default is load-bearing -- left unset, the active pane inherits
# window-style and the tint lands on the pane you are busy answering, which is
# noise: the red border and the prompt itself already have your attention.
set -g window-style        "bg=#{?#{==:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},},needs-input},#{@cockpit_blocked_bg},default}"
set -g window-active-style "bg=default"
# The ◔NN% suffix needs scripts/agent-context wired into a statusLine (see
# examples/claude-hooks.json's _statusline_comment) -- without it @panestate_ctx
# is never set, the comparison is against an empty string, and the suffix
# never renders. 80% is the same rough compaction-warning point Claude Code's
# own UI uses; colour208 is a plain 256-colour orange, deliberately not a
# theme variable, so the warning still shows up before any theme is sourced.
set -g @catppuccin_window_text " #{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{==:#{pane_title},#{host_short}},#W,#{=/16/…:#{?#{@cockpit_title},#{@cockpit_title},#{s/^✳ //:#{pane_title}}}}},#W} #{?#{m:*needs-input*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_green}]✓,#{?#{m:*A*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},A,}}},#[fg=#{@thm_overlay_0}]○,}}}}}#{?#{e|>=:#{@panestate_ctx},80},#[fg=colour208] ◔#{@panestate_ctx}%,}"
set -g @catppuccin_window_current_text " #{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{?#{==:#{pane_title},#{host_short}},#W,#{=/34/…:#{?#{@cockpit_title},#{@cockpit_title},#{s/^✳ //:#{pane_title}}}}},#W} #{?#{m:*needs-input*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},#{@panestate},} }},#[fg=#{@thm_green}]✓,#{?#{m:*A*,#{P:#{?#{m:*|#{pane_current_command}|*,#{@cockpit_agents_glob}},A,}}},#[fg=#{@thm_overlay_0}]○,}}}}}#{?#{e|>=:#{@panestate_ctx},80},#[fg=colour208] ◔#{@panestate_ctx}%,}"
set -g @catppuccin_directory_text "#{=/30/…:#{agent_where_path}}"
set -g @catppuccin_gitmux_text "#{agent_where_branch}"

# Makes the branch segment clickable. cockpit.tmux binds MouseDown1Control1, but
# it cannot mark the range itself: status-right belongs to your config.
# Guarded because -a APPENDS: reloading ~/.tmux.conf would otherwise stack a
# second clickable segment onto the first, and a third on the next reload.
if -F "#{!=:#{m:*range=control|1*,#{status-right}},1}" {
  set -ag status-right "#[range=control|1]#{E:@catppuccin_status_gitmux}#[norange]"
}

# And the directory segment: control|2 opens the folder browser at the pane's
# working dir. Wrap whatever renders your path the same way:
#   set -g status-right "#[range=control|2]#{E:@catppuccin_status_directory}#[norange]..."

# blocked/errored agents in EVERY session -- the two numbers worth interrupting
# your focus for. The window dots only ever speak for the session you are
# looking at, so a session you are not attached to can sit blocked unnoticed;
# this counts the whole server. It renders nothing at all when nothing waits.
# Left commented because status-right is yours: put the token where you want it.
#   set -ag status-right "#{agent_fleet}"

# LAST. cockpit.tmux rewrites the #{agent_*} tokens above into the shell calls
# that answer them, so it has to run after the options that carry them exist --
# run-shell blocks the command queue, so loading it earlier means it reads
# options that are not set yet and silently leaves the raw token in your status
# bar. Keep this line below everything above, and before tpm.
run-shell ~/.tmux/plugins/tmux-cockpit/cockpit.tmux
