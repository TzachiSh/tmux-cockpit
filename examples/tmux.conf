# tmux-cockpit: the block to copy into ~/.tmux.conf.
# Everything here is native tmux format syntax -- no shell runs on redraw.

run-shell ~/.tmux/plugins/tmux-cockpit/cockpit.tmux

set -g pane-border-status top
set -g pane-border-style        "fg=#{?#{==:#{@panestate},needs-input},#{@thm_red},#{?#{==:#{@panestate},error},#{@thm_peach},#{?#{==:#{@panestate},running},#{@thm_yellow},#{?#{==:#{@panestate},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-active-border-style "fg=#{?#{==:#{@panestate},needs-input},#{@thm_red},#{?#{==:#{@panestate},error},#{@thm_peach},#{?#{==:#{@panestate},running},#{@thm_yellow},#{?#{==:#{@panestate},done},#{@thm_green},#{@thm_overlay_0}}}}}"
set -g pane-border-format "#{?#{&&:#{pane_active},#{!=:#{S:#{W:#{?window_active,,#{?#{m:*needs-input*,#{P:#{@panestate} }},#{window_index}:#{window_name} ,}}}},}},─ NEEDS YOU #{S:#{W:#{?window_active,,#{?#{m:*needs-input*,#{P:#{@panestate} }},#{window_index}:#{window_name} ,}}}},#{?#{==:#{@panestate},needs-input},─ NEEDS YOU ,#{?#{==:#{@panestate},error},─ ERROR ,}}}"
set -g @catppuccin_window_text " #W #{?#{m:*needs-input*,#{P:#{@panestate} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{@panestate} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{@panestate} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{@panestate} }},#[fg=#{@thm_green}]✓,#[fg=#{@thm_overlay_0}]○}}}}"
set -g @catppuccin_window_current_text " #W #{?#{m:*needs-input*,#{P:#{@panestate} }},#[fg=#{@thm_red}]▲,#{?#{m:*error*,#{P:#{@panestate} }},#[fg=#{@thm_peach}]✕,#{?#{m:*running*,#{P:#{@panestate} }},#[fg=#{@thm_yellow}]●,#{?#{m:*done*,#{P:#{@panestate} }},#[fg=#{@thm_green}]✓,#[fg=#{@thm_overlay_0}]○}}}}"
set -g @catppuccin_directory_text "#{=/30/…:#{agent_where_path}}"
set -g @catppuccin_gitmux_text "#{agent_where_branch}"
