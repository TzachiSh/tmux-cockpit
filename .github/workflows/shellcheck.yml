name: shellcheck

on:
  push:
  pull_request:

jobs:
  lint:
    # ci-cockpit, TzachiSh/ci-box#367. The job container brings make, curl and
    # xz, which the runner image lacks. It runs as the runner's uid: a root job
    # leaves root-owned files in the shared checkout that the next job, on the
    # runner itself, cannot clean.
    runs-on: [self-hosted, cockpit]
    container:
      image: rust:1-bookworm
      options: --user 1000:1000
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned: apt's 0.9.0 has no --extended-analysis, and without it the
      # lint of tests/run.sh needs 15+ GB and the runner is shut down.
      - name: Install shellcheck
        run: |
          v=v0.11.0
          t=$RUNNER_TEMP
          curl -fsSL -o "$t/sc.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/$v/shellcheck-$v.linux.x86_64.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $t/sc.tar.xz" | sha256sum -c -
          tar -xJf "$t/sc.tar.xz" -C "$t"
          echo "$t/shellcheck-$v" >> "$GITHUB_PATH"
          "$t/shellcheck-$v/shellcheck" --version
      # make lint skips without shellcheck, so the --version above is what
      # makes a failed install fail the job instead of linting nothing.
      - run: make lint
