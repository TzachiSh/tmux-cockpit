name: tui-musl

# The release asset scripts/tui-fetch downloads for Linux x86_64 (#404). On a PR
# cockpit-tui-release.yml skips build-local-artifacts, so a change that breaks
# this target (a toolchain file, a dep, a profile flag) showed only at tag time.
# Filtered to the paths that reach the musl build: all of tui/ (a source change
# can break only this target, e.g. a glibc-only libc call), a root .cargo config,
# the toolchain files, dist's config, the Makefile and the workflows. The shell
# suite gates stay unfiltered. master and scratch/* pushes get it too: a
# combination of PRs that breaks musl shows on master, not at tag time, and a
# fail-first branch without a PR still runs it.
on:
  pull_request:
    paths:
      - 'tui/**'
      - '.cargo/**'
      - '**/rust-toolchain'
      - '**/rust-toolchain.toml'
      - dist-workspace.toml
      - Makefile
      - .github/workflows/**
  push:
    branches: [master, 'scratch/**']
    paths:
      - 'tui/**'
      - '.cargo/**'
      - '**/rust-toolchain'
      - '**/rust-toolchain.toml'
      - dist-workspace.toml
      - Makefile
      - .github/workflows/**

permissions:
  contents: read

# Same group rule as tui.yml: per commit on master and scratch/*, never
# cancelled; per PR merge ref otherwise, so a newer push cancels only the
# superseded run.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.ref == 'refs/heads/master'
    || startsWith(github.ref, 'refs/heads/scratch/')) && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  musl-build:
    # Pinned so the image changes on purpose: bump it by hand (#401).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The same two steps, in the same two directories, as cargo-dist's build:
      # it runs `rustup target add` from the repo root and `cargo build` from
      # tui/. A rust-toolchain file in tui/ therefore picks a toolchain that
      # never got the target, and that is exactly what this job must catch
      # (#398). `cd tui` before the rustup call would add the target to the
      # toolchain the file picks and hide the break. Plain cargo rather than
      # `dist build`: the failure is cargo's, dist adds only archives, and the
      # job needs no dist install or release-workflow edit (that file is
      # regenerated by `dist generate`). dist also runs `sudo apt-get install
      # musl-tools` here; it is left out because tui/Cargo.lock has no `cc`
      # crate. If a C-building dep lands, add it, or this job goes red where the
      # release would pass.
      - name: Add the musl target the way dist does, at the repo root
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build the release asset's binary
        working-directory: tui
        run: |
          rustc --version
          cargo build --locked --release --target x86_64-unknown-linux-musl
