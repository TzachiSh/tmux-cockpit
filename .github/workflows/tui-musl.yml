name: tui-musl

# The release asset scripts/tui-fetch downloads for Linux x86_64 (#404). On a PR
# cockpit-tui-release.yml skips build-local-artifacts, so a change that breaks
# this target (a toolchain file, a dep, a profile flag) showed only at tag time.
# Filtered to the files that can break it; the shell-suite gates stay unfiltered.
on:
  pull_request:
    paths:
      - tui/Cargo.toml
      - tui/Cargo.lock
      - '**/rust-toolchain'
      - '**/rust-toolchain.toml'
      - dist-workspace.toml
      - Makefile
      - .github/workflows/**

jobs:
  musl-build:
    # ci-cockpit, same container and uid as tui.yml (TzachiSh/ci-box#367): the
    # image brings cargo and a linker, and uid 1000 leaves the shared checkout
    # cleanable by the next job. Its rustup home is the container's own, so the
    # target add below dies with it. No musl-tools: tui/Cargo.lock has no cc crate.
    runs-on: [self-hosted, cockpit]
    container:
      image: rust:1-bookworm
      options: --user 1000:1000
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The same two steps, in the same two directories, as cargo-dist's build:
      # it runs `rustup target add` from the repo root and `cargo build` from
      # tui/. A rust-toolchain file in tui/ therefore picks a toolchain that
      # never got the target, and that is exactly what this job must catch
      # (#398). `cd tui` before the rustup call would add the target to the
      # toolchain the file picks and hide the break. Plain cargo rather than
      # `dist build`: the failure is cargo's, dist adds only archives, and the
      # job needs no dist install or release-workflow edit (that file is
      # regenerated by `dist generate`).
      - name: Add the musl target the way dist does, at the repo root
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build the release asset's binary
        working-directory: tui
        run: |
          rustc --version
          cargo build --locked --release --target x86_64-unknown-linux-musl
