name: shell-suite

# The ~2500-row suite behind tests/run.sh covers every script in scripts/. It ran
# only on developers' machines until now (#476). Unfiltered, like tui.yml: any
# change can break a script.
on:
  push:
    branches: [master, 'scratch/**']
  pull_request:

permissions:
  contents: read

# Same group rule as tui.yml: per commit on master and scratch/*, never
# cancelled; per PR merge ref otherwise, so a newer push cancels only the
# superseded run of the same PR.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.ref == 'refs/heads/master'
    || startsWith(github.ref, 'refs/heads/scratch/')) && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  shell-suite:
    # Pinned: bump on purpose (#401). Both images are required legs, so a tool
    # difference between them shows up here. 24.04 passes since #481 (a real
    # jq 1.7 bug in the scripts) and #482 were fixed. One cached tmux per image
    # serves this job and tui-test.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # A missing tmux must fail the tests, not pass them in 0.00 s (#471). The
      # tests read this once the test-side check lands; the variable is set here
      # first so that PR changes no workflow.
      COCKPIT_REQUIRE_TMUX: '1'
    steps:
      # Full history: the #290 key-notes block upgrades from older commits and
      # skips (8 checks) on a depth-1 clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/tmux
      # What the suite takes from the box, and what it does when it is absent:
      #  - locale: C.UTF-8 is on the image; the blocks that need it SKIP if not.
      #  - xterm-ghostty terminfo: not in the image's ncurses-term, so the two
      #    phone-pty rows SKIP (visible in the final count).
      #  - code: the prelude puts a stub first on PATH, so no editor is needed.
      - name: Show what the suite sees
        run: |
          tmux -V
          jq --version
          cut --version | head -1
          locale -a | grep -ix 'c\.utf-\?8' || echo "no C.UTF-8 locale"
          infocmp xterm-ghostty >/dev/null 2>&1 && echo "xterm-ghostty terminfo: present" || echo "xterm-ghostty terminfo: absent (its rows skip)"
      - run: make tui-bin
      # A private, short tmux socket dir (#803). With none, SOCKDIR is /tmp/tmux-<uid>, the
      # same path a test could hardcode, so such a test stayed green here (#784). Short for
      # the 108-byte socket path limit (#766).
      - name: Private TMUX_TMPDIR
        run: |
          d="$RUNNER_TEMP/tx"; mkdir -p "$d"
          echo "TMUX_TMPDIR=$d" >> "$GITHUB_ENV"
          printf 'TMUX_TMPDIR=%s (%d bytes)\n' "$d" "${#d}"
      - run: J=4 make test-par
      # Nothing of the suite's may be left in the default socket dir once it is done (#811).
      # TMUX_TMPDIR is private above, so a test that hardcodes /tmp/tmux-<uid> leaks there,
      # and no row would see it unless it looked.
      - name: No suite socket left in /tmp/tmux-<uid>
        if: success() || failure()
        run: |
          d="/tmp/tmux-$(id -u)"
          left=$(find "$d" -maxdepth 1 -name 'cockpit-*' 2>/dev/null)
          if [ -n "$left" ]; then
              echo "left in $d after the suite:"
              find "$d" -maxdepth 1 -name 'cockpit-*' -exec ls -la {} +
              ss -xlp 2>/dev/null | grep -F "$d/cockpit-" || echo "(no listener)"
              exit 1
          fi
          echo "nothing of the suite's in $d"
