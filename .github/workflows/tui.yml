name: tui

# Unfiltered: the shell scripts call the binary, so every change can break it.
on:
  push:

# One runner (ci-cockpit) takes every job in turn, so each run costs the queue.
# Push alone: a PR's checks are its head commit's, and a pull_request trigger
# beside it ran every job twice. A newer push to a branch cancels its older run;
# master keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  tui-test:
    # ci-cockpit, TzachiSh/ci-box#367. The job container brings make and a
    # linker, which the runner image lacks. It runs as the runner's uid, so the
    # checkout stays cleanable by the next job. The toolchain lands in the
    # image's own rustup home, so rustup default below changes nothing on the
    # runner.
    runs-on: [self-hosted, cockpit]
    container:
      image: rust:1-bookworm
      options: --user 1000:1000
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Exactly the floor, never "stable": pinning here is what catches an
      # accidental MSRV bump, and the number lives in Cargo.toml alone.
      - name: Pin the toolchain to Cargo.toml's rust-version
        run: |
          floor=$(sed -n 's/^rust-version *= *"\(.*\)".*/\1/p' tui/Cargo.toml)
          [ -n "$floor" ] || { echo "no rust-version in tui/Cargo.toml" >&2; exit 1; }
          rustup toolchain install "$floor" --profile minimal --component clippy,rustfmt
          rustup default "$floor"
          rustc --version
      - run: make tui-test
      # The release build is a separate failure mode from the test build: LTO,
      # panic=abort and the dist profile only compile here.
      - run: make tui
