name: tui

# Unfiltered: the shell scripts call the binary, so every change can break it.
on:
  push:
    branches: [master, 'scratch/**']
  pull_request:

permissions:
  contents: read

# Each commit is checked once. A PR runs on the pull_request event only (its
# branch is not in the push list), because a fork's pushes run in the fork and a
# public repo's fork PRs get no CI from push alone. master and scratch/* run on
# push, so every merge is checked and a lane's fail-first branch without a PR
# still gets CI. The group is the commit for those two, so no run there is ever
# cancelled: a newer push to master must not cancel a running check on the
# merge before it, and a fail-first commit still reports red after the restored
# one is pushed. A PR's group is its merge ref, so a newer push cancels only the
# superseded run of the same PR.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.ref == 'refs/heads/master'
    || startsWith(github.ref, 'refs/heads/scratch/')) && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  tui-test:
    # Pinned: bump on purpose (#401). Both images are required legs, like
    # shell-suite. The tmux-driven tests run on the 3.8 the tmux action builds
    # (the README's floor, #471), not the image's own tmux, and the two jobs share
    # one cached tmux per image.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # A missing tmux must fail the tmux tests, not pass them in 0.00 s (#471).
      COCKPIT_REQUIRE_TMUX: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tmux
      # Exactly the floor, never "stable": pinning here is what catches an
      # accidental MSRV bump, and the number lives in Cargo.toml alone.
      - name: Pin the toolchain to Cargo.toml's rust-version
        run: |
          floor=$(sed -n 's/^rust-version *= *"\(.*\)".*/\1/p' tui/Cargo.toml)
          [ -n "$floor" ] || { echo "no rust-version in tui/Cargo.toml" >&2; exit 1; }
          rustup toolchain install "$floor" --profile minimal --component clippy,rustfmt
          rustup default "$floor"
          rustc --version
      # tui-test in private, empty TMPDIR and TMUX_TMPDIR: a test that leaves a
      # file, dir or tmux socket behind fails the job, named (#400)
      - run: make tui-test-clean
      # The release build is a separate failure mode from the test build: LTO,
      # panic=abort and the dist profile only compile here.
      - run: make tui
